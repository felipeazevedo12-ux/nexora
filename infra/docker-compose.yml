services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
